<!doctype html>
<html lang="ru" class="dark">
	<head>
		<meta charset="utf-8" />

		<!--
			viewport-fit=cover отдаёт приложению зону под чёлкой и жестовой полосой;
			реальные отступы приходят из CSS-переменных безопасных зон Telegram.
			user-scalable=no убирает зум по двойному тапу и скачок вёрстки
			при фокусе на поле ввода внутри WebView Telegram.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0D0D10" />
		<meta name="color-scheme" content="dark" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!--
			SDK Telegram обязан выполниться ДО кода приложения. Скрипт синхронный
			и стоит выше точки вставки head, иначе window.Telegram.WebApp ещё
			не существует в момент монтирования Svelte.
		-->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>

		%sveltekit.head%
	</head>

	<!--
		preload-data="tap": наведения на тач-устройстве не существует,
		предзагрузка по нажатию — единственный рабочий вариант.
	-->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
