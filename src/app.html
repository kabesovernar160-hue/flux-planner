<!doctype html>
<html lang="ru" class="dark">
	<head>
		<meta charset="utf-8" />

		<!--
			viewport-fit=cover отдаёт приложению зону под чёлкой и жестовой полосой;
			реальные отступы приходят из CSS-переменных безопасных зон Telegram.
			user-scalable=no убирает зум по двойному тапу и скачок вёрстки
			при фокусе на поле ввода внутри WebView Telegram.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0D0D10" />
		<meta name="color-scheme" content="dark" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!--
			Приложение на главном экране телефона, без Telegram.
			Манифест — для Android и десктопного Chrome; iOS читает свои мета-теги
			и apple-touch-icon. black-translucent отдаёт приложению зону под
			строкой состояния, отступ приходит из env(safe-area-inset-top)
			через --fx-safe-top. Внутри Telegram всё это ни на что не влияет.
		-->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Flux" />
		<meta name="application-name" content="Flux Planner" />

		<!--
			Предложение установки Chrome присылает один раз и может успеть до того,
			как смонтируется приложение. Событие откладывается здесь, а забирает
			его $lib/pwa, когда человек дойдёт до экрана установки.
		-->
		<script>
			window.addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
				window.__fxInstallPrompt = event;
			});
		</script>

		<!--
			Фон до загрузки стилей бандла, в тон --fx-void обеих тем.
			Без него между первым кадром и CSS окно успевало мигнуть белым
			(или тёмным в светлой теме).
		-->
		<style>
			html {
				background-color: #0d0d10;
			}
			html[data-theme='light'] {
				background-color: #f4f4f9;
			}
		</style>

		<!--
			SDK Telegram обязан выполниться ДО кода приложения. Скрипт синхронный
			и стоит выше точки вставки head, иначе window.Telegram.WebApp ещё
			не существует в момент монтирования Svelte.
		-->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>

		<!--
			Тема до первой отрисовки. Приложение рендерится только на клиенте,
			и без этого скрипта первый кадр всегда был бы тёмным, а светлая тема
			включалась бы вспышкой после загрузки бандла.

			Порядок как в $lib/theme: явный выбор из кеша (ключ fx-theme),
			иначе тема клиента Telegram (SDK уже разобрал её из хеша запуска),
			иначе системная. Вне Telegram SDK тоже есть, но platform там 'unknown'.
		-->
		<script>
			(function () {
				var scheme = 'dark';
				try {
					var saved = localStorage.getItem('fx-theme');
					var wa = window.Telegram && window.Telegram.WebApp;
					if (saved === 'light' || saved === 'dark') scheme = saved;
					else if (wa && wa.platform && wa.platform !== 'unknown')
						scheme = wa.colorScheme === 'light' ? 'light' : 'dark';
					else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)
						scheme = 'light';
				} catch (e) {
					/* хранилище или SDK недоступны — остаётся тёмная */
				}
				var root = document.documentElement;
				root.setAttribute('data-theme', scheme);
				if (scheme === 'light') {
					root.classList.remove('dark');
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', '#F4F4F9');
					var cs = document.querySelector('meta[name="color-scheme"]');
					if (cs) cs.setAttribute('content', 'light');
				}
			})();
		</script>

		%sveltekit.head%
	</head>

	<!--
		preload-data="tap": наведения на тач-устройстве не существует,
		предзагрузка по нажатию — единственный рабочий вариант.
	-->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
