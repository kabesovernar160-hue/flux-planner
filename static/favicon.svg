<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>Flux Planner</title>
	<defs>
		<linearGradient id="fx-tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1C1C24" />
			<stop offset="100%" stop-color="#0D0D10" />
		</linearGradient>
		<linearGradient id="fx-mark" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0%" stop-color="#8E6FE8" />
			<stop offset="55%" stop-color="#A58AF4" />
			<stop offset="100%" stop-color="#B7A1F7" />
		</linearGradient>
		<radialGradient id="fx-glow" cx="30%" cy="16%" r="78%">
			<stop offset="0%" stop-color="#A58AF4" stop-opacity="0.34" />
			<stop offset="100%" stop-color="#A58AF4" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="64" height="64" rx="16" fill="url(#fx-tile)" />
	<rect width="64" height="64" rx="16" fill="url(#fx-glow)" />
	<rect
		x="0.5"
		y="0.5"
		width="63"
		height="63"
		rx="15.5"
		fill="none"
		stroke="#A58AF4"
		stroke-opacity="0.28"
	/>

	<!-- Дуга прогресса на 3/4 круга: длина окружности при r=19 равна 119,38, три четверти — 89,54. -->
	<circle
		cx="32"
		cy="32"
		r="19"
		fill="none"
		stroke="url(#fx-mark)"
		stroke-width="4.5"
		stroke-linecap="round"
		stroke-dasharray="89.54 119.38"
		transform="rotate(-90 32 32)"
	/>

	<!-- Растущие столбцы — мотив планирования, тот же, что в графике трат. -->
	<g fill="url(#fx-mark)">
		<rect x="24" y="35" width="4.5" height="7" rx="2.25" />
		<rect x="29.75" y="30" width="4.5" height="12" rx="2.25" />
		<rect x="35.5" y="25" width="4.5" height="17" rx="2.25" />
	</g>
</svg>
